packages:
  - 'packages/*'
  - 'products/*'
  - 'plugins/*'
# pnpm 10+ requires explicit approval for dependency lifecycle scripts. The
# placeholder strings committed previously made `pnpm install` fail with
# ERR_PNPM_IGNORED_BUILDS. `canvas` is required by the image-snapshot jest
# suites; esbuild/unrs-resolver are needed by tooling. electron,
# electron-chromedriver and puppeteer are left off because their postinstall
# downloads large binaries; flip them to true when working on the desktop
# product or browser tests.
allowBuilds:
  canvas: true
  core-js-pure: false
  electron: false
  electron-chromedriver: false
  esbuild: true
  puppeteer: false
  unrs-resolver: true
